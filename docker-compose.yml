services:
  flexllama:
    image: flexllama:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Docker limits locked memory to 8 MB by default, so models with
    # "load_mode": "mmap+mlock" would log "failed to mlock" and not be locked.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    profiles: ["cpu"]
    ports:
      # FlexLLama API and dashboard. Runners (8095+) listen on 127.0.0.1 inside
      # the container and are reached through the API, so they are not published.
      - "8090:8090"
    volumes:
      - ./docker/config.qwen3.unified.json:/app/config.json:ro  # Configuration file
      - ./models:/app/models:ro                   # Model files directory
    environment:
      - FLEXLLAMA_CONFIG=/app/config.json
      - FLEXLLAMA_HOST=0.0.0.0
      - FLEXLLAMA_PORT=8090
    networks:
      - flexllama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flexllama-gpu:
    image: flexllama-gpu:latest
    build:
      context: .
      dockerfile: Dockerfile.cuda
    restart: unless-stopped
    # Docker limits locked memory to 8 MB by default, so models with
    # "load_mode": "mmap+mlock" would log "failed to mlock" and not be locked.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    profiles: ["gpu"]
    ports:
      # FlexLLama API and dashboard. Runners (8095+) listen on 127.0.0.1 inside
      # the container and are reached through the API, so they are not published.
      - "8090:8090"
    volumes:
      - ./docker/config.qwen3.unified.json:/app/config.json:ro
      - ./models:/app/models:ro
    environment:
      - FLEXLLAMA_CONFIG=/app/config.json
      - FLEXLLAMA_HOST=0.0.0.0
      - FLEXLLAMA_PORT=8090
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all # Or specify a number of GPUs, e.g., 1
    networks:
      - flexllama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flexllama-vulkan:
    image: flexllama-vulkan:latest
    build:
      context: .
      dockerfile: Dockerfile.vulkan
    restart: unless-stopped
    # Docker limits locked memory to 8 MB by default, so models with
    # "load_mode": "mmap+mlock" would log "failed to mlock" and not be locked.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    profiles: ["vulkan"]
    ports:
      # FlexLLama API and dashboard. Runners (8095+) listen on 127.0.0.1 inside
      # the container and are reached through the API, so they are not published.
      - "8090:8090"
    volumes:
      - ./docker/config.qwen3.unified.json:/app/config.json:ro
      - ./models:/app/models:ro
    devices:
    - /dev/dri:/dev/dri  # GPU access for AMD and Intel
    # AMD ROCm systems should also add:
    # - /dev/kfd:/dev/kfd
    user: "0:0"
    environment:
      - FLEXLLAMA_CONFIG=/app/config.json
      - FLEXLLAMA_HOST=0.0.0.0
      - FLEXLLAMA_PORT=8090
      - VK_LOADER_DEBUG=error
      - HOST_VIDEO_GID=${VIDEO_GID:-44}
      - HOST_RENDER_GID=${RENDER_GID:-109}
    cap_add:
      - SYS_PTRACE
    group_add:
      - video
    networks:
      - flexllama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  flexllama-network:
    driver: bridge

volumes:
  models:
    driver: local
  logs:
    driver: local