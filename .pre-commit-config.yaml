exclude: |
  (?x)^(
    frontend/vendor/|
    logs/|
    tests/logs/|
    \.venv/|
    venv_uv/|
    dist/|
    build/|
    .*__pycache__/
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|css|html)$
        exclude: ^frontend/vendor/
